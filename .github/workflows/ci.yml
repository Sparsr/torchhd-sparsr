name: CI

# Builds the package against an unpacked Sparsr HDC tarball and runs its tests on the
# Sparsr VM, including the one that builds the package again from a copy of its sources.
# Then runs both examples, because no test covers them.
#
# The tarball is fetched from a Sparsr release with a read-only token. A pull request from
# a fork has no access to that token, so it cannot run the full check; a maintainer pushes
# the branch to this repository to run it. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # SPARSR_GITHUB_RELEASES_REPO, a repository variable, names the GitHub repository whose
  # GitHub Releases carry the Sparsr tarballs; SPARSR_GITHUB_RELEASES_TOKEN, a repository
  # secret, is a read-only token for that repository.
  # The tag of the GitHub release the HDC tarball is taken from. Pinned so that a runtime change cannot
  # break a package change that touched nothing; bump it on purpose.
  SPARSR_HDC_GITHUB_RELEASE_TAG: nightly-20260910-184506-34516050919-1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the Sparsr HDC tarball
        env:
          GH_TOKEN: ${{ secrets.SPARSR_GITHUB_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "No SPARSR_GITHUB_RELEASES_TOKEN is available to this run, so the HDC tarball cannot be fetched."
            echo "That is expected for a pull request from a fork: a maintainer runs the full check"
            echo "by pushing the branch to this repository. See CONTRIBUTING.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/hdc"
          gh release download "$SPARSR_HDC_GITHUB_RELEASE_TAG" --repo "${{ vars.SPARSR_GITHUB_RELEASES_REPO }}" --pattern 'sparsr-hdc-*.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/sparsr-hdc-*.tar.gz -C "$RUNNER_TEMP/hdc" --strip-components=1
          echo "SPARSR_HDC_ROOT=$RUNNER_TEMP/hdc" >> "$GITHUB_ENV"

      # The CPU wheel: the default index pulls the CUDA build and gigabytes of nvidia-*
      # packages that nothing here uses.
      #
      # torchvision is here for the MNIST example, which reads the dataset with
      # it. It goes in the same command as torch so that the resolver picks a
      # matching pair once, rather than pulling a different torch later and
      # breaking the extension this job compiled against it.
      - name: Install PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: |
          pip install --upgrade "setuptools>=77"
          pip install --no-build-isolation .[test]

      - name: Run the tests
        run: pytest -v tests

      # The examples are what a reader runs first, and no test covers them. The
      # basic one checks each result against the CPU and raises when they
      # differ, so running it is the check.
      #
      # MNIST runs on a slice: 2,000 training and 200 test images take about 5
      # seconds, against 33 for the full run, and the full run proves nothing
      # the slice does not. It needs an accuracy floor as well as an exit code,
      # because a broken encoding still prints a number, and 10% would look
      # exactly like a pass. A working slice scores about 72%, and the floor is
      # 60% so that ordinary variation never fails the job.
      - name: Run the examples
        run: |
          set -euo pipefail
          python examples/basic/example.py
          python examples/mnist/example.py --train 2000 --test 200 | tee mnist.log
          accuracy=$(sed -n 's/^Accuracy: \([0-9.]*\)%.*/\1/p' mnist.log)
          if [[ -z "$accuracy" ]]; then
            echo "The MNIST example printed no accuracy line."
            exit 1
          fi
          awk -v measured="$accuracy" 'BEGIN {
            if (measured + 0 < 60) {
              printf "MNIST accuracy %s%% is below the 60%% floor.\n", measured
              exit 1
            }
            printf "MNIST accuracy %s%%, above the 60%% floor.\n", measured
          }'
