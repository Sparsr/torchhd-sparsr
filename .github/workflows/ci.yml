name: CI

# Builds the package against an unpacked Sparsr HDC tarball and runs its tests on the
# Sparsr VM, including the one that builds the package again from a copy of its sources.
#
# The tarball is fetched from a Sparsr release with a read-only token. A pull request from
# a fork has no access to that token, so it cannot run the full check; a maintainer pushes
# the branch to this repository to run it. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # SPARSR_RELEASES_REPO, a repository variable, names where Sparsr publishes its releases;
  # SPARSR_RELEASES_TOKEN, a repository secret, reads them.
  # The Sparsr release the HDC tarball is taken from. Pinned so that a runtime change cannot
  # break a package change that touched nothing; bump it on purpose.
  SPARSR_HDC_RELEASE: nightly-20260910-184506-34516050919-1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the Sparsr HDC tarball
        env:
          GH_TOKEN: ${{ secrets.SPARSR_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "No SPARSR_RELEASES_TOKEN is available to this run, so the HDC tarball cannot be fetched."
            echo "That is expected for a pull request from a fork: a maintainer runs the full check"
            echo "by pushing the branch to this repository. See CONTRIBUTING.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/hdc"
          gh release download "$SPARSR_HDC_RELEASE" --repo "${{ vars.SPARSR_RELEASES_REPO }}" --pattern 'sparsr-hdc-*.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/sparsr-hdc-*.tar.gz -C "$RUNNER_TEMP/hdc" --strip-components=1
          echo "SPARSR_HDC_ROOT=$RUNNER_TEMP/hdc" >> "$GITHUB_ENV"

      # The CPU wheel: the default index pulls the CUDA build and gigabytes of nvidia-*
      # packages that nothing here uses.
      - name: Install PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: |
          pip install --upgrade "setuptools>=77"
          pip install --no-build-isolation .[test]

      - name: Run the tests
        run: pytest -v tests
